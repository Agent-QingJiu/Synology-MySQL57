name: Build DSM 6.2.3 SPK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mysql57-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify upstream sources and Synology toolkit
        run: bash ci/fetch "$RUNNER_TEMP/toolkit"
      - name: Compile with the DSM Bromolow toolchain
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/project:ro" \
            -v "$RUNNER_TEMP/toolkit:/toolkit" \
            -w /toolkit ubuntu:18.04 bash /project/ci/build
      - name: Build and verify the SPK
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          bash ci/package "$RUNNER_TEMP/toolkit" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: MySQL-5.7.44-DSM6.2.3-bromolow
          path: dist/*
          if-no-files-found: error
          retention-days: 90
