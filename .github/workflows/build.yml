name: Build DSM 6.2.3 SPK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'SynoBuildConf/**'
      - 'scripts/**'
      - 'conf/**'
      - 'INFO.sh'

concurrency:
  group: mysql57-dsm62-bromolow
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout package source
        uses: actions/checkout@v4

      - name: Build in DSM 6.2-compatible Ubuntu environment
        run: |
          mkdir -p "$RUNNER_TEMP/toolkit"
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/toolkit:/toolkit" \
            -w /workspace ubuntu:18.04 bash -lc '
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                ca-certificates git wget curl python python2.7 python-pip \
                python3 python3-pip python3-setuptools cifs-utils \
                build-essential cmake bison pkg-config libncurses5-dev \
                libaio-dev libtirpc-dev rsync xz-utils zip unzip
              git clone --depth 1 https://github.com/SynologyOpenSource/pkgscripts-ng.git /toolkit/pkgscripts-ng
              chmod +x /toolkit/pkgscripts-ng/EnvDeploy /toolkit/pkgscripts-ng/PkgCreate.py
              /toolkit/pkgscripts-ng/EnvDeploy -v 6.2 -p bromolow
              mkdir -p /toolkit/source
              cp -a /workspace /toolkit/source/MySQL
              cd /toolkit
              ./pkgscripts-ng/PkgCreate.py -v 6.2 -p bromolow -c MySQL
              mkdir -p /workspace/dist
              find /toolkit/result_spk -type f -name "*.spk" -exec cp -v {} /workspace/dist/ \;
              find /workspace/dist -maxdepth 1 -type f -name "*.spk" -print -quit > /tmp/mysql-spk-found
              test -s /tmp/mysql-spk-found
              sha256sum /workspace/dist/*.spk | tee /workspace/dist/SHA256SUMS
            '

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySQL-5.7.44-DSM6.2.3-bromolow
          path: dist/*
          if-no-files-found: error
          retention-days: 30
